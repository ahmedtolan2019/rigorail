name: Deploy demo

# Publishes the backend-free demo to GitHub Pages on every push to main, at
# https://<owner>.github.io/<repository>/. Enable Pages with "GitHub Actions" as
# the source (Settings > Pages) once per repository.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.16.0
      - run: npm ci
      - run: npm run build:demo
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_APP_RELEASE: ${{ github.sha }}
      # Pages serves 404.html for unknown paths, which lets the SPA handle deep links.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
