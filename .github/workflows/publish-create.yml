name: Publish create-rigorail

# Publishes the `npm create rigorail` initializer when a tag like
# create-rigorail@0.2.0 is pushed. Uses npm trusted publishing: npm checks this
# repository and workflow through GitHub's OIDC token, so no npm token is stored.
# Configure it on npmjs.com under create-rigorail > Settings > Trusted publishing.
on:
  push:
    tags: ['create-rigorail@*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      - run: node --test packages/create-rigorail/index.test.mjs
      - name: Check the tag matches the package version
        run: |
          version=$(node -p "require('./packages/create-rigorail/package.json').version")
          test "${GITHUB_REF_NAME}" = "create-rigorail@${version}"
      # A version published by hand before the tag is pushed is left as it is.
      - name: Check whether this version is already on npm
        id: published
        run: |
          version=$(node -p "require('./packages/create-rigorail/package.json').version")
          if npm view "create-rigorail@${version}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "create-rigorail@${version} is already published; skipping."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.published.outputs.exists != 'true'
        run: npm publish --provenance --access public
        working-directory: packages/create-rigorail
