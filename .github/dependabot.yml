# Weekly grouped dependency updates. Review each PR with npm run check and the
# browser suite; see docs/dependency-maintenance.md for major upgrades.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # Major versions change APIs (TypeScript, TanStack, Vite): plan them as
    # deliberate upgrades per docs/dependency-maintenance.md, not weekly PRs.
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
