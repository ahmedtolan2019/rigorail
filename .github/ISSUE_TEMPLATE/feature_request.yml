name: Feature or pattern request
description: Propose a capability, screen pattern or agent workflow.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you or your coding agent trying to build, and what is missing?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The behavior you would like. Link the nearest existing composition if one exists.
  - type: textarea
    id: scope
    attributes:
      label: Frontend scope
      description: Rigorail is frontend only. Describe the backend contract the feature would rely on.
