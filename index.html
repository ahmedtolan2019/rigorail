<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Foundation: a modular enterprise application workspace."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="theme-color"
      content="#ffffff"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#0c1219"
      media="(prefers-color-scheme: dark)"
    />
    <title>Foundation</title>
    <script>
      // Apply saved theme and direction before first paint to avoid a flash.
      // Keys use appConfig.id ("foundation") from src/app/config.ts; keep them in sync.
      try {
        var root = document.documentElement
        var theme = localStorage.getItem('foundation:theme') || 'light'
        if (theme === 'system')
          theme = matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light'
        root.classList.add(theme)
        root.style.colorScheme = theme
        var language = localStorage.getItem('foundation:language')
        if (language === 'ar') {
          root.lang = 'ar'
          root.dir = 'rtl'
        }
      } catch (error) {}
    </script>
  </head>
  <body>
    <noscript
      >Foundation needs JavaScript. Enable it and reload the page.</noscript
    >
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
